<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;color:#1a1a2e;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px;background:#fff;border-radius:16px;margin-bottom:30px;box-shadow:0 2px 12px rgba(0,0,0,0.04)}
header h1{font-size:28px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
header p{color:#6b7280;font-size:14px}
.filter-bar{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.filter-btn{padding:8px 20px;border-radius:20px;border:1px solid #e5e7eb;background:#fff;color:#4b5563;cursor:pointer;font-size:14px;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #f0f0f0;transition:transform .2s,box-shadow .2s;display:block!important}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.platform-tag{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:4px}
.platform-tag.twitter{background:#1da1f2}.platform-tag.youtube{background:#ff0000}.platform-tag.instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.heat{font-size:16px}
.card-title{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:12px}
.card-proposal{font-size:14px;color:#4b5563;margin-bottom:8px;padding:12px;background:#f9fafb;border-radius:8px;border-left:3px solid #6b8fa3}
.card-copy{font-size:13px;color:#6b7280;font-style:italic;margin:12px 0}
.card-link{display:inline-block;padding:8px 16px;background:#1a1a2e;color:#fff;text-decoration:none;border-radius:8px;font-size:13px;transition:background .2s}
.card-link:hover{background:#2d3748}
.timestamp{text-align:center;color:#9ca3af;font-size:13px;margin-bottom:24px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>

<button class="filter-btn" onclick="filterCards('YouTube')">YouTube</button>
<button class="filter-btn" onclick="filterCards('Instagram')">Instagram</button>

<br>
<div class="grid" id="cardGrid"></div>
</div>

function renderCards(cards){
var grid=document.getElementById('cardGrid');
grid.innerHTML='';
cards.forEach(function(c){
var cls=c.platform==='Twitter/X'?'twitter':c.platform==='YouTube'?'youtube':'instagram';
var viewsHTML=c.views?'<div style="font-size:12px;color:#9ca3af;margin-top:4px">'+c.views+'</div>':'';
var card=document.createElement('div');
card.className='card';
card.setAttribute('data-platform',c.platform);
card.innerHTML='<div class="card-header"><span class="platform-tag '+cls+'">'+c.platform+'</span><span class="heat">'+c.heat+'</span></div><div class="card-title">'+c.title+'</div><div class="card-proposal">💡 '+c.proposal+'</div><div class="card-copy">'+c.copy+'</div>'+viewsHTML+'<a class="card-link" href="'+c.link+'" target="_blank" rel="noopener">查看原文 →</a>';
grid.appendChild(card);
});
updateStats(cards);
}

function updateStats(displayed){
document.getElementById('totalCount').textContent=allCards.length;
document.getElementById('twitterCount').textContent=allCards.filter(function(c){return c.platform==='Twitter/X'}).length;
document.getElementById('youtubeCount').textContent=allCards.filter(function(c){return c.platform==='YouTube'}).length;
document.getElementById('instagramCount').textContent=allCards.filter(function(c){return c.platform==='Instagram'}).length;
document.getElementById('allCount').textContent=displayed.length;
}

function filterCards(platform){
var btns=document.querySelectorAll('.filter-btn');
btns.forEach(function(b){b.classList.remove('active')});
event.target.classList.add('active');
if(platform==='all'){renderCards(allCards);return}
var filtered=allCards.filter(function(c){return c.platform===platform});
renderCards(filtered);
}

document.getElementById('timestamp').textContent='数据更新于：'+new Date().toLocaleString('zh-CN');
renderCards(allCards);
</script>
