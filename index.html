<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellvape Trend Radar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;color:#1a1a2e;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px}
/* 过滤提示条 */
.filter-banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.filter-banner.hidden{display:none}
.filter-banner a{color:#1a1a2e;text-decoration:underline;font-weight:600}
.filter-banner button{padding:6px 14px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px;margin-left:12px}
.filter-banner button:hover{background:#f3f4f6}
header{text-align:center;padding:40px 20px;background:#fff;border-radius:16px;margin-bottom:30px;box-shadow:0 2px 12px rgba(0,0,0,0.04)}
header h1{font-size:28px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
header p{color:#6b7280;font-size:14px}
.header-stats{display:flex;gap:20px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.stat{background:#f8f9fa;padding:12px 24px;border-radius:10px;text-align:center}
.stat div:first-child{font-size:24px;font-weight:700;color:#1a1a2e}
.stat div:last-child{font-size:12px;color:#6b7280}
.filter-bar{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.filter-btn{padding:8px 20px;border-radius:20px;border:1px solid #e5e7eb;background:#fff;color:#4b5563;cursor:pointer;font-size:14px;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.switch-container{display:flex;align-items:center;gap:10px;margin-top:16px;justify-content:center;font-size:14px;color:#6b7280}
.switch{position:relative;width:44px;height:24px;background:#d1d5db;border-radius:12px;cursor:pointer;transition:background .2s}
.switch.active{background:#1a1a2e}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.switch.active::after{transform:translateX(20px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #f0f0f0;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.platform-tag{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:4px}
.platform-tag.twitter{background:#1da1f2}.platform-tag.youtube{background:#ff0000}.platform-tag.instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.heat{font-size:16px}
.card-title{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:12px}
.card-proposal{font-size:14px;color:#4b5563;margin-bottom:8px;padding:12px;background:#f9fafb;border-radius:8px;border-left:3px solid #6b8fa3}
.card-copy{font-size:13px;color:#6b7280;font-style:italic;margin:12px 0}
.card-link{display:inline-block;padding:8px 16px;background:#1a1a2e;color:#fff;text-decoration:none;border-radius:8px;font-size:13px;transition:background .2s}
.card-link:hover{background:#2d3748}
.timestamp{text-align:center;color:#9ca3af;font-size:13px;margin-bottom:24px}
.filtered-count{text-align:center;color:#6b7280;font-size:13px;margin-bottom:16px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>

<div class="stat"><div id="totalCount">0</div><div>Total Trends</div></div>
<div class="stat"><div id="twitterCount">0</div><div>Twitter/X</div></div>
<div class="stat"><div id="youtubeCount">0</div><div>YouTube</div></div>
<div class="stat"><div id="instagramCount">0</div><div>Instagram</div></div>
</div>
</header>
<div class="timestamp" id="timestamp"></div>
<!-- 过滤提示条 -->
<div class="filter-banner" id="filterBanner">
<span>已过滤 <strong id="filteredCount">0</strong> 条泛标签（如 #viral、#trending），<a href="#" onclick="showAll()">点击查看全部</a></span>
<button onclick="toggleFilter()">关闭自动过滤</button>
</div>
<div class="filter-bar">
<button class="filter-btn active" onclick="filterCards('all')">全部 (<span id="allCount">0</span>)</button>
<button class="filter-btn" onclick="filterCards('Twitter/X')">Twitter/X</button>
<button class="filter-btn" onclick="filterCards('YouTube')">YouTube</button>
<button class="filter-btn" onclick="filterCards('Instagram')">Instagram</button>
</div>
<div class="switch-container">
<span>仅显示时效热点（事件型）</span>
<div class="switch active" id="trendSwitch" onclick="toggleFilter()"></div>
</div>
<br>
<div class="filtered-count" id="filteredMsg"></div>
<div class="grid" id="cardGrid"></div>
</div>
<script>

// 判断是否为泛标签
function isGenericTag(title){
var lower=title.toLowerCase().replace(/[^a-z0-9]/g,'');
return blackList.indexOf(lower)>=0;
}

示","copy":"Built for players who push further.","views":"890K views"},{"platform":"YouTube","title":"GTA VI Official Gameplay Trailer","link":"https://www.youtube.com/watch?v=gmneae5WOjc","emoji":"play","heat":"★★★★★","proposal":"视觉融合：游戏过场风格","copy":"Next Level gear for the next generation.","views":"42M views"},{"platform":"YouTube","title":"Why Everyone's Talking About AI Agents","link":"https://www.youtube.com/watch?v=demo123","emoji":"play","heat":"★★★★★","proposal":"热点二创：AI生成机械结构拆解视频","copy":"Intelligence meets engineering.","views":"1.2M views"},{"platform":"Instagram","title":"viral","link":"https://www.instagram.com/explore/tags/viral/","emoji":"camera","heat":"★★★★★","proposal":"反差梗/Meme格式","copy":"We dont follow trends. We set the pace."},{"platform":"Instagram","title":"trending","link":"https://www.instagram.com/explore/tags/trending/","emoji":"camera","heat":"★★★★☆","proposal":"反差梗/Meme格式","copy":"We dont follow trends. We set the pace."},{"platform":"Instagram","title":"explore","link":"https://www.instagram.com/explore/tags/explore/","emoji":"camera","heat":"★★★★☆","proposal":"POV格式：探索新设备 vs 升级设备","copy":"Best discoveries are builds not places."},{"platform":"Instagram","title":"fyp","link":"https://www.instagram.com/explore/tags/fyp/","emoji":"camera","heat":"★★★★★","proposal":"Meme格式：FYP vs 真品味","copy":"Your feed is loud. Your tank is loud enough."},{"platform":"Instagram","title":"reels","link":"https://www.instagram.com/explore/tags/reels/","emoji":"camera","heat":"★★★★★","proposal":"15秒Reels快节奏产品展示","copy":"Click. Build. Vaporize."},{"platform":"Instagram","title":"fashion","link":"https://www.instagram.com/explore/tags/fashion/","emoji":"camera","heat":"★★★☆☆","proposal":"时尚大片但主角是设备","copy":"The gear in your hand not clothes on you."},{"platform":"Instagram","title":"food","link":"https://www.instagram.com/explore/tags/food/","emoji":"camera","heat":"★★☆☆☆","proposal":"通用标签玩法","copy":"Trending now."},{"platform":"Instagram","title":"travel","link":"https://www.instagram.com/explore/tags/travel/","emoji":"camera","heat":"★★☆☆☆","proposal":"通用标签玩法","copy":"Trending now."},{"platform":"Instagram","title":"fitness","link":"https://www.instagram.com/explore/tags/fitness/","emoji":"camera","heat":"★★☆☆☆","proposal":"通用标签玩法","copy":"Trending now."},{"platform":"Instagram","title":"beauty","link":"https://www.instagram.com/explore/tags/beauty/","emoji":"camera","heat":"★★☆☆☆","proposal":"通用标签玩法","copy":"Trending now."}];

var filterEnabled=true;

function getFilteredCards(cards){
if(!filterEnabled)return cards;
return cards.filter(function(c){return !isGenericTag(c.title)});
}

function renderCards(cards){
var grid=document.getElementById('cardGrid');
grid.innerHTML='';
cards.forEach(function(c){
var cls=c.platform==='Twitter/X'?'twitter':c.platform==='YouTube'?'youtube':'instagram';
var viewsHTML=c.views?'<div style="font-size:12px;color:#9ca3af;margin-top:4px">'+c.views+'</div>':'';
var card=document.createElement('div');
card.className='card';
card.setAttribute('data-platform',c.platform);
card.setAttribute('data-generic',isGenericTag(c.title)?'true':'false');
card.innerHTML='<div class="card-header"><span class="platform-tag '+cls+'">'+c.platform+'</span><span class="heat">'+c.heat+'</span></div><div class="card-title">'+c.title+'</div><div class="card-proposal">💡 '+c.proposal+'</div><div class="card-copy">'+c.copy+'</div>'+viewsHTML+'<a class="card-link" href="'+c.link+'" target="_blank" rel="noopener">查看原文 →</a>';
grid.appendChild(card);
});
updateStats(cards);
}

function updateStats(displayed){
document.getElementById('totalCount').textContent=allCards.length;
document.getElementById('twitterCount').textContent=allCards.filter(function(c){return c.platform==='Twitter/X'}).length;
document.getElementById('youtubeCount').textContent=allCards.filter(function(c){return c.platform==='YouTube'}).length;
document.getElementById('instagramCount').textContent=allCards.filter(function(c){return c.platform==='Instagram'}).length;
document.getElementById('allCount').textContent=displayed.length;
}

function filterCards(platform){
var btns=document.querySelectorAll('.filter-btn');
btns.forEach(function(b){b.classList.remove('active')});
event.target.classList.add('active');
var filtered=getFilteredCards(allCards);
if(platform==='all'){renderCards(filtered);return}
var finalFiltered=filtered.filter(function(c){return c.platform===platform});
renderCards(finalFiltered);
}

function toggleFilter(){
filterEnabled=!filterEnabled;
var sw=document.getElementById('trendSwitch');
var banner=document.getElementById('filterBanner');
var msg=document.getElementById('filteredMsg');
if(filterEnabled){
sw.classList.add('active');
banner.classList.remove('hidden');
}else{
sw.classList.remove('active');
banner.classList.add('hidden');
}
var displayed=filterEnabled?getFilteredCards(allCards):allCards;
renderCards(displayed);
msg.textContent=filterEnabled?'已开启仅显示时效热点':'已显示所有趋势（包含泛标签）';
}

function showAll(){
filterEnabled=false;
var sw=document.getElementById('trendSwitch');
var banner=document.getElementById('filterBanner');
var msg=document.getElementById('filteredMsg');
sw.classList.remove('active');
banner.classList.add('hidden');
renderCards(allCards);
msg.textContent='已显示所有趋势（包含泛标签）';
}

document.getElementById('timestamp').textContent='数据更新于：'+new Date().toLocaleString('zh-CN');
var initialFiltered=getFilteredCards(allCards);
var filteredCount=allCards.length-initialFiltered.length;
document.getElementById('filteredCount').textContent=filteredCount;
document.getElementById('filteredMsg').textContent='已自动过滤 '+filteredCount+' 条泛标签';
renderCards(initialFiltered);
</script>
</body>
</html>
